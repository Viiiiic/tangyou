services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4173"
      VISION_PROVIDER: "${VISION_PROVIDER:-minimax}"
      MINIMAX_REGION: "${MINIMAX_REGION:-cn}"
      TTS_MODE: "${TTS_MODE:-minimax}"
      MINIMAX_VOICE_ID: "${MINIMAX_VOICE_ID:-Chinese (Mandarin)_Kind-hearted_Antie}"
      MINIMAX_TTS_MODEL: "${MINIMAX_TTS_MODEL:-speech-2.8-hd}"
      MINIMAX_TTS_SPEED: "${MINIMAX_TTS_SPEED:-1.15}"
      AUTH_REQUIRED: "${AUTH_REQUIRED:-1}"
      AUTH_TOKEN_TTL_DAYS: "${AUTH_TOKEN_TTL_DAYS:-30}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://viiiiic.github.io,http://localhost:4173}"
    volumes:
      - tangyou_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/api/health | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tangyou_storage:
  caddy_data:
  caddy_config:
