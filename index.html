<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>糖友</title>
    <link rel="stylesheet" href="./styles.css?v=20260430-auth" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="phone" aria-label="糖友小程序原型">
        <header class="topbar">
          <div class="brand-lockup">
            <img class="brand-logo" src="./assets/tangyou-logo-option2.png?v=20260430-option2" alt="" />
            <h1>糖友</h1>
          </div>
          <button class="logout-button hidden" id="logoutBtn" type="button">退出</button>
        </header>

        <section class="screen" id="authScreen" data-screen="auth">
          <div class="auth-card">
            <h2>先登录</h2>
            <p>内部试用，登录后才能识别饭菜。</p>
            <label for="authName">称呼</label>
            <input id="authName" type="text" autocomplete="username" placeholder="例如：妈妈" />
            <label for="authPassword">密码</label>
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="至少 6 位" />
            <label for="inviteCode">邀请码</label>
            <input id="inviteCode" type="text" autocomplete="one-time-code" placeholder="注册时填写" />
            <button class="primary-action compact" id="loginBtn" type="button">登录</button>
            <button class="text-action auth-secondary" id="registerBtn" type="button">邀请码注册</button>
            <p class="auth-message" id="authMessage"></p>
          </div>
        </section>

        <section class="screen active" id="cameraScreen" data-screen="camera">
          <div class="screen-heading">
            <h2>对准饭菜</h2>
          </div>

          <button class="camera-frame" id="cameraFrameBtn" type="button" aria-label="饭前拍一下拍饭菜">
            <img src="./assets/camera-guide.png?v=20260430-no-line" alt="" />
          </button>

          <button class="primary-action" id="takePhotoBtn" type="button">饭前拍一下</button>
          <input id="cameraInput" class="camera-input" type="file" accept="image/*" capture="environment" aria-label="拍饭菜照片" />
        </section>

        <section class="screen" id="analyzingScreen" data-screen="analyzing">
          <div class="analysis-card">
            <div class="pulse-ring" aria-hidden="true"></div>
            <h2>正在看这顿饭</h2>
            <p id="analysisHint">如果看不清，我会直接告诉你。</p>
            <div class="progress-bar"><span id="progressFill"></span></div>
          </div>
        </section>

        <section class="screen" id="resultScreen" data-screen="result">
          <article class="result-card" id="resultCard">
            <div class="food-judgement" id="foodJudgement">
              <div class="food-group can">
                <div class="food-group-label">可以吃</div>
                <div class="food-group-list" id="canEatList">没有</div>
              </div>
              <div class="food-group limit">
                <div class="food-group-label">少量吃</div>
                <div class="food-group-list" id="limitEatList">没有</div>
              </div>
              <div class="food-group avoid">
                <div class="food-group-label">不能吃</div>
                <div class="food-group-list" id="avoidEatList">没有</div>
              </div>
            </div>
            <div class="result-verdict" id="resultVerdict">米饭少半碗</div>
          </article>

          <div class="result-actions">
            <button class="primary-action compact" id="listenBtn" type="button">听怎么做</button>
          </div>

          <button class="text-action" id="resultBackBtn" data-go="camera" type="button">再拍一张</button>
        </section>

        <div class="toast" id="toast" role="status"></div>
      </section>
    </main>

    <script src="./app.js?v=20260430-auth"></script>
  </body>
</html>
